services:
  postgres:
    image: postgres:17-alpine
    container_name: squadragram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./squadragram-backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
      - ./squadragram-backend/migrations/000002_skill_order.up.sql:/docker-entrypoint-initdb.d/000002_skill_order.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: squadragram-minio
    restart: unless-stopped
    command: server /data --address ":9005" --console-address ":9000"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    ports:
      - "9005:9005"
      - "9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./squadragram-backend
      dockerfile: Dockerfile
    container_name: squadragram-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      PORT: 3001
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      MINIO_ENDPOINT: minio:9005
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: 12345678
      MINIO_BUCKET: squadragram-media
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
